<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#f7f3ea;--surface:#fffdf8;--soft:#f0ece2;--ink:#1d2925;--muted:#61706a;--line:rgba(29,41,37,.15);--gold:#b47a1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif SC",serif;line-height:1.6}
main{max-width:1040px;margin:0 auto;padding:clamp(18px,4vw,36px)}
.caption{font-family:"SFMono-Regular",Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--muted)}
.prose{color:var(--muted);white-space:pre-wrap;margin:8px 0 0}
.card{background:rgba(255,253,248,.86);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 28px rgba(54,44,24,.06)}
.source{padding:15px 19px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.fields{padding:4px 20px}
.field{padding:17px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.fold{margin:0 0 14px}
.fold>summary{list-style:none;cursor:pointer;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,253,248,.86);box-shadow:0 12px 28px rgba(54,44,24,.06);font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px}
.fold>summary::-webkit-details-marker{display:none}
.fold[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:12px}
.fold[open]{border-radius:16px}
.sheet{width:100%;border-collapse:collapse;font-size:14px;color:var(--muted)}
.sheet th,.sheet td{text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.sheet th{border-top:0;font-weight:500;color:var(--muted);font-size:12px}
