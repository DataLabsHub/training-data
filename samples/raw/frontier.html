<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1d2925;--muted:#61706a;--line:rgba(29,41,37,.15);--soft:#f0ece2}
*{box-sizing:border-box}body{margin:0;background:#f7f3ea;color:var(--ink);font-family:Georgia,"Noto Serif SC",serif;line-height:1.6}
main{max-width:880px;margin:0 auto;padding:28px 22px 48px}
h1{font-size:28px;font-weight:500;margin:0 0 8px}
p{color:var(--muted)}
article{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:0 0 14px}
h2{font-size:18px;margin:0 0 8px}
pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<main>
<h1>click · jsonschema</h1>
<p>两道真实仓库上的改动题。每道都有题面、测试、参考补丁和评分条目。与 cattrs、actix-web、Gitea 不是同一批。</p>
<article>
<h2>click</h2>
<pre>click。补全结果要和解析器使用同一套大小写规则。
设置了归一化函数时，子命令和选项名的补全应返回声明的写法。
16 条评分，其中 13 条不通过则整题不通过。</pre>
</article>
<article>
<h2>jsonschema</h2>
<pre>jsonschema。install 的状态行要和其他命令一样，经统一的着色函数输出。
指定始终着色时，获取、打包、写入、校验为青色加粗，已安装为绿色加粗。
关闭着色时，纯文本须与原来逐字节相同。</pre>
</article>
</main>
</body>
</html>
