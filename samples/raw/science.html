<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1d2925;--muted:#61706a;--line:rgba(29,41,37,.15);--soft:#f0ece2}
*{box-sizing:border-box}body{margin:0;background:#f7f3ea;color:var(--ink);font-family:Georgia,"Noto Serif SC",serif;line-height:1.6}
main{max-width:880px;margin:0 auto;padding:28px 22px 48px}
h1{font-size:28px;font-weight:500;margin:0 0 8px}
p{color:var(--muted)}
pre{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:16px 18px;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<main>
<h1 data-t="科学">科学</h1>
<p>与 GPQA 里已有的三道题不是同一批。目前只有说明，没有随附的输入文件。</p>
<pre>表面电极离子阱
按目标高度、频率与 q 生成电极几何和驱动配置，并独立验算。

石墨烯与 Li 原子势
在不同 DFT 来源之间改进能量和力，保持力与能量梯度一致。

ECP5-85F
在 ECP5-85F、50 MHz 和固定周期预算内改进采样求解。

p-bit
在有限测量次数内校准会随温度漂移的器件阵列。

生命科学
DNA 修复主分子核型。用 Nanopore 长读长、Illumina 短读长、拷贝数和实验设计，重建主结构。
必要项全部通过才得 1。离线重算，不把表型直接当成结构。</pre>
</main>
</body>
</html>
