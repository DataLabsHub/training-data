schema_version = "1.2"
artifacts = ["/app/deliverables/figure3_reconciliation_register.xlsx", "/app/deliverables/publication_release_memo.docx"]

[task]
name = "academic/publication_figure_data_consistency"
description = "A long-horizon Publication figure and data consistency review workspace task with frozen binary rubrics and recorded multi-model Pass@1 evaluations."
keywords = ["workspace", "long-horizon", "binary-rubric", "multimodal", "office-document"]

[metadata]
name = "publication_figure_data_consistency"
topic = "academic"
tags = ["workspace", "long-horizon", "binary-rubric", "multimodal"]
sector = "Professional, Scientific, and Technical Services"
occupation = "Research Specialists"
difficulty_tier = "Advanced Plus"
multimodal = true
web_search_required = false
est_minutes = 360

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 8192
storage_mb = 30720
allow_internet = true

[verifier.env]
JUDGE_MODEL = "${JUDGE_MODEL:-gpt-5.6-luna}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-openai}"
JUDGE_API_PROTOCOL = "${JUDGE_API_PROTOCOL:-responses}"
JUDGE_API_KEY = "${JUDGE_API_KEY}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL}"
JUDGE_BACKEND = "${JUDGE_BACKEND:-codex}"
JUDGE_REASONING_EFFORT = "${JUDGE_REASONING_EFFORT:-high}"
JUDGE_CODEX_BIN = "${JUDGE_CODEX_BIN:-codex}"
JUDGE_PER_TIMEOUT = "${JUDGE_PER_TIMEOUT:-1200}"
JUDGE_CONCURRENCY = "${JUDGE_CONCURRENCY:-4}"
JUDGE_MAX_TRIES = "${JUDGE_MAX_TRIES:-3}"
JUDGE_REPEATS = "${JUDGE_REPEATS:-1}"

[solution]
timeout_sec = 1200.0

[solution.env]
OPENAI_API_KEY = "${JUDGE_API_KEY:-}"
OPENAI_BASE_URL = "${JUDGE_BASE_URL:-}"
